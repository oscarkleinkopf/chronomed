version: '3.8'
services:
  postgres:
    image: postgres:15-alpine
    container_name: chronomed_postgres
    restart: always
    environment:
      POSTGRES_USER: chronomed_user
      POSTGRES_PASSWORD: chronomed_password_2026
      POSTGRES_DB: chronomed_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
