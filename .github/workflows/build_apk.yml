name: Build Android APK (ChronoMed)

on:
  push:
    branches: [ main ]
    paths:
      - 'mobile/**'
      - '.github/workflows/build_apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter Environment
        run: flutter doctor -v

      - name: Scaffold Android Project
        run: |
          mkdir -p /tmp/chronomed_backup
          cp mobile/android/app/src/main/AndroidManifest.xml /tmp/chronomed_backup/AndroidManifest.xml
          rm -rf mobile/android
          cd mobile
          flutter create --platforms=android --org com.chronomed .
          cp /tmp/chronomed_backup/AndroidManifest.xml android/app/src/main/AndroidManifest.xml

      - name: Configure Android Gradle Build Settings
        run: |
          cd mobile
          cat << 'EOF' > android/app/proguard-rules.pro
          -dontwarn **
          -dontnote **
          -keep class com.google.** { *; }
          -keep class androidx.** { *; }
          -keep class io.flutter.** { *; }
          EOF

          python3 - << 'EOF'
          import os, re

          # 1. Patch app/build.gradle or app/build.gradle.kts
          target = 'android/app/build.gradle'
          is_kts = False
          if os.path.exists('android/app/build.gradle.kts'):
              target = 'android/app/build.gradle.kts'
              is_kts = True

          with open(target, 'r') as f:
              content = f.read()

          # Set compileSdk 34 and minSdk 23
          content = re.sub(r'compileSdk\s*=.*', 'compileSdk = 34', content)
          content = re.sub(r'compileSdkVersion\s+.*', 'compileSdkVersion 34', content)
          content = re.sub(r'minSdk\s*=.*', 'minSdk = 23', content)
          content = re.sub(r'minSdkVersion\s+.*', 'minSdkVersion 23', content)

          if is_kts:
              if 'isCoreLibraryDesugaringEnabled' not in content:
                  content = content.replace('compileOptions {', 'compileOptions {\n        isCoreLibraryDesugaringEnabled = true')
              if 'coreLibraryDesugaring' not in content:
                  if 'dependencies {' in content:
                      content = content.replace('dependencies {', 'dependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.0.4")')
                  else:
                      content += '\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.0.4")\n}\n'
              content = content.replace('signingConfig =', 'isMinifyEnabled = false\n            isShrinkResources = false\n            signingConfig =')
          else:
              if 'coreLibraryDesugaringEnabled' not in content:
                  content = content.replace('compileOptions {', 'compileOptions {\n        coreLibraryDesugaringEnabled true')
              if 'coreLibraryDesugaring' not in content:
                  if 'dependencies {' in content:
                      content = content.replace('dependencies {', 'dependencies {\n    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.0.4"')
                  else:
                      content += '\ndependencies {\n    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.0.4"\n}\n'
              content = content.replace('signingConfig ', 'minifyEnabled false\n            shrinkResources false\n            signingConfig ')

          with open(target, 'w') as f:
              f.write(content)

          # 2. Disable checkAarMetadata in root build.gradle to prevent legacy plugin metadata mismatch
          root_gradle = 'android/build.gradle'
          if os.path.exists(root_gradle):
              with open(root_gradle, 'a') as f:
                  f.write('''
          subprojects {
              project.tasks.configureEach { task ->
                  if (task.name.contains("AarMetadata") || task.name.contains("aarMetadata")) {
                      task.enabled = false
                  }
              }
          }
          ''')

          print(f"Successfully configured Android build settings and bypassed checkAarMetadata")
          EOF

      - name: Get Flutter Packages
        run: |
          cd mobile
          flutter pub get

      - name: Build Android Release APK
        run: |
          cd mobile
          flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChronoMed-release-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create or Update GitHub Release with APK
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-apk
          name: "ChronoMed v1.0.0 (Android APK)"
          body: |
            ### 📱 ChronoMed - Instalador Nativo para Android
            Descarga el archivo `app-release.apk` directamente en tu celular Android para instalar la aplicación nativa con soporte de alarmas exactas fuera de línea, síntesis de voz y modo dual (Senior / Cuidador).
            
            - **Paciente Configurado:** Marcela
            - **Versión:** 1.0.0
            - **Compatibilidad:** Android 7.0+ (API 24+)
          files: mobile/build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
